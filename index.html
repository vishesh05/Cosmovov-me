<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CosmoVoc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Cinzel', 'serif'],
            },
            colors: {
              ivory: {
                50: '#FDFCFB',
                100: '#F9F8F6',
                200: '#F2F0EB',
              },
              charcoal: {
                800: '#2D2A26',
                900: '#1A1816',
              },
              gold: {
                400: '#D4AF37', // Muted metallic gold
                500: '#C5A059',
                600: '#997B3D',
              },
              cosmic: {
                50: '#F0F2F6',
                100: '#E6E6FA',
                200: '#C5CCDA',
                300: '#8A99B3',
                400: '#6C7E9E',
                500: '#4F5D75', // Muted Indigo
                600: '#3D495E',
                700: '#2A354A',
                800: '#1A2234',
                900: '#0F1626',
                950: '#0A0E17',
              }
            },
            backgroundImage: {
              'constellation': "url('https://www.transparenttextures.com/patterns/stardust.png')",
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #F9F8F6;
        color: #2D2A26;
        -webkit-font-smoothing: antialiased;
      }

      /* Subtle Noise Overlay */
      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Elegant Fade */
      .fade-enter { opacity: 0; transform: translateY(8px); }
      .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 0.5s ease, transform 0.5s ease; }
      
      /* Smooth input autofill */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0px 1000px #F9F8F6 inset;
        -webkit-text-fill-color: #2D2A26;
        transition: background-color 5000s ease-in-out 0s;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "astronomy-engine": "https://esm.sh/astronomy-engine@2.1.19"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root">
      <!-- Inline Splash Screen — CosmoVoc Branding -->
      <div id="splash-screen" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FDFCFB;z-index:9999;font-family:'Manrope',sans-serif;overflow:hidden;">
        
        <!-- Ambient glow -->
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(212,175,55,0.1) 0%,transparent 70%);border-radius:50%;filter:blur(100px);animation:splash-glow-pulse 5s ease-in-out infinite;pointer-events:none;"></div>

        <!-- Floating Planets & Elements -->
        <!-- Top-Left: Small Planet -->
        <div style="position:absolute;top:4rem;left:3rem;opacity:0.4;animation:splash-float-slow 4s ease-in-out infinite;">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="12" fill="#D4AF37" fill-opacity="0.2" />
                <circle cx="20" cy="20" r="11.5" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="2 2" />
            </svg>
        </div>

        <!-- Top-Right: Crescent Moon -->
        <div style="position:absolute;top:6rem;right:2.5rem;opacity:0.3;animation:splash-float-medium 6s ease-in-out infinite;animation-delay:1s;">
            <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
                <path d="M35 15C35 26.0457 26.0457 35 15 35C13.606 35 12.2541 34.8576 10.9546 34.5884C14.7709 38.5606 20.1009 41 26 41C37.0457 41 46 32.0457 46 21C46 13.626 42.0016 7.18561 36.0355 3.65476C35.3615 7.19934 35 10.8582 35 15Z" fill="#C5A059" />
            </svg>
        </div>

        <!-- Bottom-Left: Saturn Ring -->
        <div style="position:absolute;bottom:8rem;left:2rem;opacity:0.4;animation:splash-float-medium 6s ease-in-out infinite;">
            <svg width="80" height="60" viewBox="0 0 80 60" fill="none">
                <ellipse cx="40" cy="30" rx="35" ry="10" stroke="#D4AF37" stroke-width="0.5" opacity="0.6" />
                <circle cx="40" cy="30" r="12" fill="#F2F0EB" stroke="#D4AF37" stroke-width="0.5" />
                <path d="M10 30C10 32.7614 23.4315 35 40 35C56.5685 35 70 32.7614 70 30" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="4 2" />
            </svg>
        </div>

        <!-- Bottom-Right: Floating Dots/Planet -->
        <div style="position:absolute;bottom:5rem;right:4rem;opacity:0.3;animation:splash-float-slow 4s ease-in-out infinite;animation-delay:2s;">
            <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                <circle cx="15" cy="15" r="4" fill="#4F5D75" fill-opacity="0.4" />
                <circle cx="15" cy="15" r="8" stroke="#4F5D75" stroke-width="0.3" />
            </svg>
        </div>

        <!-- Twinkling Stars -->
        <div style="position:absolute;top:25%;left:33%;animation:splash-twinkle 3s ease-in-out infinite;animation-delay:0.5s;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3l1.9 5.8 1.9-5.8a2 2 0 0 1 1.3-1.3l5.8-1.9-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>
        </div>
        <div style="position:absolute;bottom:25%;right:25%;animation:splash-twinkle 3s ease-in-out infinite;animation-delay:1.2s;transform:scale(0.75);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.5"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3l1.9 5.8 1.9-5.8a2 2 0 0 1 1.3-1.3l5.8-1.9-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>
        </div>

        <!-- Faint Constellation Lines -->
        <svg style="position:absolute;inset:0;width:100%;height:100%;opacity:0.03;pointer-events:none;" viewBox="0 0 400 800">
            <path d="M50 100 L120 180 L80 250 L150 300" stroke="#2D2A26" stroke-width="0.5" fill="none" />
            <path d="M300 600 L350 520 L280 480 L320 400" stroke="#2D2A26" stroke-width="0.5" fill="none" />
            <path d="M100 700 L180 650 L140 580" stroke="#2D2A26" stroke-width="0.5" fill="none" />
        </svg>

        <!-- Main Content -->
        <div style="position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;">
            
            <!-- Logo Box -->
            <div style="margin-bottom:2rem;border-radius:50%;background:#1A1816;display:flex;align-items:center;justify-content:center;padding:0.75rem;border:1px solid rgba(255,255,255,0.1);box-shadow:0 25px 50px -12px rgba(26,24,22,0.25);animation:splash-logo-in 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;">
                <!-- CosmoVoc Avatar SVG -->
                <div style="width:64px;height:64px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background-color:#1A1A2E;border:1px solid rgba(212,168,67,0.4);box-shadow:0 0 8px rgba(212,168,67,0.3);">
                    <svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 3 L17.5 4.5 L19 5 L17.5 5.5 L17 7 L16.5 5.5 L15 5 L16.5 4.5 Z" fill="#D4A843" />
                    </svg>
                </div>
            </div>

            <!-- Title -->
            <h1 style="font-family:'Cinzel',serif;font-size:2.25rem;line-height:2.5rem;color:#1A1816;letter-spacing:-0.025em;margin:0;opacity:0;animation:splash-text-reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;animation-delay:0.4s;">
                CosmoVoc
            </h1>

            <!-- Subtitle -->
            <div style="display:flex;align-items:center;gap:0.5rem;margin-top:1rem;opacity:0;animation:splash-text-reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;animation-delay:0.7s;">
                <div style="height:1px;width:2rem;background:#D4AF37;opacity:0.4;"></div>
                <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.4em;color:#997B3D;font-weight:700;">Divine Wisdom</span>
                <div style="height:1px;width:2rem;background:#D4AF37;opacity:0.4;"></div>
            </div>
        </div>

        <!-- Bottom Branding -->
        <div style="position:absolute;bottom:3rem;opacity:0;animation:splash-text-reveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;animation-delay:1.2s;">
            <p style="font-size:9px;text-transform:uppercase;letter-spacing:0.2em;color:#A8A29E;font-weight:500;margin:0;">Powered by Shatavo</p>
        </div>
      </div>
      
      <style>
        @keyframes splash-float-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes splash-float-medium { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } }
        @keyframes splash-twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.6; } }
        @keyframes splash-text-reveal { 0% { opacity: 0; transform: translateY(20px); filter: blur(10px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
        @keyframes splash-logo-in { 0% { opacity: 0; transform: scale(0.85); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes splash-glow-pulse { 0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; } 50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.5; } }
      </style>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
